name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m compileall -q app.py
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run test:run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python -m pytest -q
        env:
          RIO_AGENT_TOKEN: test-token
      - run: npx playwright install --with-deps chromium webkit
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - run: docker build -t rio-console-ci .

  publish-image:
    name: Publish SHA image to GHCR
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/deepria/discord-bot-console
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish commit image
        run: |
          image="$IMAGE_NAME:$GITHUB_SHA"
          docker build --platform linux/amd64 \
            --build-arg "GIT_REVISION=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "$image" .
          docker push "$image"
          printf 'Published image: `%s`\n' "$image" >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  deploy-production:
    name: Deploy and verify Rio production
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: rio-production-deployment
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check this is still the latest main commit
        id: current
        run: |
          set -euo pipefail
          latest_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          [[ "$latest_sha" =~ ^[0-9a-f]{40}$ ]]
          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'Skipped production deployment: a newer main commit exists.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Update SHA image, deploy, and verify runtime
        if: steps.current.outputs.deploy == 'true'
        env:
          COOLIFY_BASE_URL: https://coolify.deepria.com
          COOLIFY_APPLICATION_UUID: mbz2qkppo9ba8bhep6l1hond
          RIO_CONSOLE_URL: https://rio.deepria.com
          RIO_IMAGE_NAME: ghcr.io/deepria/discord-bot-console
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          COOLIFY_CONFIG_TOKEN: ${{ secrets.COOLIFY_CONFIG_TOKEN }}
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: python scripts/deploy_coolify.py --revision "$GITHUB_SHA"

