<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rio Control Center</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0d10;
            color: #e8eaed;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .wrap {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .sub {
            color: #8b949e;
            margin-bottom: 28px;
        }

        .grid {
            display: grid;
        grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .card {
            background: #15181d;
            border: 1px solid #272b33;
            border-radius: 12px;
            padding: 18px;
        }

        .label {
            color: #8b949e;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .value {
            font-size: 22px;
            font-weight: 700;
        }

        .online {
            color: #3fb950;
        }

        .offline {
            color: #f85149;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            background: #21262d;
            color: #e8eaed;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 10px 18px;
            cursor: pointer;
        }

        button:hover {
            background: #30363d;
        }

        button.danger {
            border-color: #da3633;
        }

        pre {
            background: #0d1117;
            border: 1px solid #272b33;
            border-radius: 12px;
            padding: 16px;
            height: 420px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 13px;
            line-height: 1.5;
        }

        @media (max-width: 700px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

<div class="wrap">

    <h1>RIO CONTROL CENTER</h1>
    <div class="sub">Discord Bot Operations Console</div>

    <div class="grid">

        <div class="card">
            <div class="label">STATUS</div>
            <div id="status" class="value">...</div>
        </div>

        <div class="card">
            <div class="label">PID</div>
            <div id="pid" class="value">-</div>
        </div>

        <div class="card">
            <div class="label">MEMORY</div>
            <div id="memory" class="value">-</div>
        </div>

        <div class="card">
            <div class="label">UPTIME</div>
            <div id="uptime" class="value">-</div>
        </div>

        <div class="card">
            <div class="label">MODEL</div>
            <div id="model" class="value">-</div>
        </div>

        <div class="card">
            <div class="label">GUILDS</div>
            <div id="guilds" class="value">-</div>
        </div>

        <div class="card">
            <div class="label">DISCORD LATENCY</div>
            <div id="latency" class="value">-</div>
        </div>

        <div class="card">
            <div class="label">CPU</div>
            <div id="cpu" class="value">-</div>
        </div>

        <div class="card">
            <div class="label">DATA LINK</div>
            <div id="connection" class="value">...</div>
        </div>

    </div>

    <div class="actions">
        <button onclick="action('start')">Start</button>
        <button onclick="action('restart')">Restart</button>
        <button class="danger" onclick="action('stop')">Stop</button>
    </div>

    <h3>Recent Logs</h3>
    <pre id="logs">Loading...</pre>

    <h3>Discord / AI Events</h3>
    <pre id="events">Loading...</pre>

    <h3>Deployments</h3>
    <pre id="deployments">Loading...</pre>

</div>

<script>

let lastStatus = null;
let lastEvents = [];

function uptime(seconds) {
    if (seconds == null) return "-";

    const d = Math.floor(seconds / 86400);
    const h = Math.floor((seconds % 86400) / 3600);
    const m = Math.floor((seconds % 3600) / 60);

    return `${d}d ${h}h ${m}m`;
}

async function loadStatus() {
    try {
        const res = await fetch("/api/status");
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        lastStatus = data;
        renderStatus(data, false);
    } catch (e) {
        if (lastStatus) {
            renderStatus(lastStatus, true);
        } else {
            document.getElementById("status").textContent = "● UNAVAILABLE";
            document.getElementById("status").className = "value offline";
        }
        document.getElementById("connection").textContent = "DEGRADED";
        document.getElementById("connection").className = "value offline";
    }
}

function renderStatus(data, stale) {
    const status = document.getElementById("status");

    if (data.online) {
        status.textContent = stale ? "● STALE" : "● ONLINE";
        status.className = stale ? "value offline" : "value online";
    } else {
        status.textContent = "● OFFLINE";
        status.className = "value offline";
    }

    document.getElementById("pid").textContent = data.pid ?? "-";
    document.getElementById("memory").textContent =
        data.memory_mb != null ? `${data.memory_mb} MB` : "-";

    document.getElementById("uptime").textContent = uptime(data.uptime_seconds);

    const runtime = data.runtime || {};
    document.getElementById("model").textContent =
        runtime.model ? `${runtime.provider} / ${runtime.model}` : "-";
    document.getElementById("guilds").textContent = runtime.guild_count ?? "-";
    document.getElementById("latency").textContent =
        runtime.latency_ms != null ? `${runtime.latency_ms} ms` : "-";
    document.getElementById("cpu").textContent =
        data.cpu_percent != null ? `${data.cpu_percent}%` : "-";
    document.getElementById("connection").textContent = stale ? "STALE" : "CONNECTED";
    document.getElementById("connection").className = stale ? "value offline" : "value online";
}

async function loadEvents() {
    try {
        const res = await fetch("/api/events?lines=100");
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        lastEvents = data.events || [];
        renderEvents(lastEvents);
    } catch (e) {
        const message = `Latest event request failed: ${errorMessage(e)}\n`;
        document.getElementById("events").textContent = lastEvents.length
            ? message + eventLines(lastEvents).join("\n")
            : message + "No successful event request is available yet.";
    }
}

function eventLines(events) {
    return events.map((event) => {
        const { at, event: name, ...details } = event;
        return `${formatKst(at)} ${name || "event"} ${JSON.stringify(details)}`;
    });
}

function renderEvents(events) {
    document.getElementById("events").textContent = eventLines(events).join("\n") || "No events yet";
}

function errorMessage(error) {
    try {
        const value = JSON.parse(error.message);
        return value.detail || error.message;
    } catch (_) {
        return error.message || "unknown error";
    }
}

function formatKst(value) {
    if (!value) return "";
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return value;
    return new Intl.DateTimeFormat("ko-KR", {
        timeZone: "Asia/Seoul",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false,
    }).format(date);
}

async function loadLogs() {
    try {
        const res = await fetch("/api/logs?lines=100");
        const data = await res.json();

        document.getElementById("logs").textContent =
            data.logs.join("\n");

    } catch (e) {
        document.getElementById("logs").textContent =
            "Failed to load logs";
    }
}

function deploymentLine(item) {
    if (item.available === false) {
        return `[${item.component}] ${item.detail}`;
    }
    if (item.component === "console") {
        return [
            `[CONSOLE] revision ${item.revision || "unknown"}`,
            `  deploy: ${item.state || "unknown"}, last=${formatKst(item.at) || "-"}`,
            `  detail: ${item.detail || "-"}`,
            `  last successful: ${formatKst(item.last_success_at) || "-"}`,
        ].join("\n");
    }
    const service = item.service || {};
    const timer = item.timer || {};
    return [
        `[${String(item.component || "unknown").toUpperCase()}] revision ${item.revision || "unknown"}`,
        `  deploy: ${service.ActiveState || "unknown"}/${service.Result || "unknown"}, exit=${service.ExecMainStatus || "-"}, last=${service.ExecMainExitTimestamp || "-"}`,
        `  timer: ${timer.ActiveState || "unknown"}, next=${timer.NextElapseUSecRealtime || "-"}, last=${timer.LastTriggerUSec || "-"}`,
        `  update available: ${item.update_available ? "yes" : "no"}, local changes: ${item.working_tree_dirty ? "yes" : "no"}`,
    ].join("\n");
}

async function loadDeployments() {
    try {
        const res = await fetch("/api/deployments");
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        const rows = [data.console, ...(data.deployments || [])].filter(Boolean);
        document.getElementById("deployments").textContent = rows.map(deploymentLine).join("\n\n");
    } catch (e) {
        document.getElementById("deployments").textContent =
            "Deployment status unavailable. Check the agent service.";
    }
}

async function action(name) {
    if (name === "stop") {
        if (!confirm("Rio bot을 중지할까?")) {
            return;
        }
    }

    const res = await fetch(`/api/bot/${name}`, {
        method: "POST"
    });

    if (!res.ok) {
        alert("작업 실패");
        return;
    }

    setTimeout(() => {
        loadStatus();
        loadLogs();
    }, 1000);
}

loadStatus();
loadLogs();
loadEvents();
loadDeployments();

setInterval(loadStatus, 5000);
setInterval(loadEvents, 5000);
setInterval(loadDeployments, 10000);

const logBox = document.getElementById("logs");
const logSource = new EventSource("/api/logs/stream");

logSource.onmessage = (event) => {
    logBox.textContent += event.data + "\n";
    logBox.scrollTop = logBox.scrollHeight;
};

logSource.onerror = () => {
    console.error("Rio log stream disconnected");
};

</script>

</body>
</html>
