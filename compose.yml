services:
  rio-console:
    build:
      context: .
      args:
        GIT_REVISION: ${RIO_CONSOLE_GIT_REVISION:-unknown}
    container_name: rio-console
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - type: bind
        source: ./data
        target: /run/rio-console
        read_only: true
    networks:
      - deepria-web

networks:
  deepria-web:
    external: true
